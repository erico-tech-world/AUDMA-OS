name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: docker
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: audma_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/audma_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Migrate database up
        run: bun run db:migrate

      - name: Verify migration rollback
        run: bun run db:rollback

      - name: Verify migration replay
        run: bun run db:migrate

      - name: Build application
        run: bun run build

      - name: Build production container
        run: docker build --tag audma-os:ci .